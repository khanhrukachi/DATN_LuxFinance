name: personal_financial_management
description: A new Flutter project Spending Management

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ============================================================
  # UI
  # ============================================================
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  shimmer: ^3.0.0
  font_awesome_flutter: ^11.0.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  flutter_switch: ^0.3.2
  dropdown_button2: ^2.3.9
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.8.2
  fluttertoast: ^8.2.12

  # ============================================================
  # FIREBASE
  # ============================================================
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_storage: ^12.3.6
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6

  # ============================================================
  # AUTHENTICATION
  # ============================================================
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # ============================================================
  # LOCAL STORAGE
  # ============================================================
  shared_preferences: ^2.3.3

  # ============================================================
  # INTERNATIONALIZATION
  # Flutter 3.47.2 flutter_localizations requires intl ^0.20.3
  # ============================================================
  intl: ^0.20.3

  # ============================================================
  # INPUT / FORMATTING
  # ============================================================
  currency_text_input_formatter: ^2.2.6

  # ============================================================
  # IMAGE
  # ============================================================
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ============================================================
  # NETWORK
  # ============================================================
  http: ^1.2.2
  html: ^0.15.5

  # ============================================================
  # URL / SHARE
  # ============================================================
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

  # ============================================================
  # FILE SYSTEM
  # ============================================================
  path_provider: ^2.1.5
  screenshot: ^3.0.0

  # ============================================================
  # EXPORT
  # ============================================================
  csv: ^6.0.0
  excel: ^2.1.0

  # ============================================================
  # UTILITIES
  # ============================================================
  diacritic: ^0.1.6

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  flutter_local_notifications: ^18.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.14.1

  flutter_native_splash: ^2.4.3


# ==============================================================
# APP ICON
# ==============================================================
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo/logo.png"

  web:
    generate: true
    image_path: "assets/logo/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#7CFC00"

  windows:
    generate: true
    image_path: "assets/logo/logo.png"


# ==============================================================
# FLUTTER
# ==============================================================
flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/icons/
    - assets/lang/
    - assets/intro/